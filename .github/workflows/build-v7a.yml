name: Build v7a APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Install Android platform 34 and NDK
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/cmdline-tools/16.0/bin:$PATH"
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" "ndk;28.2.13676358"

      - name: Build armeabi-v7a debug APK (DLNA-only, stub native lib)
        run: chmod +x gradlew && ./gradlew assembleDebug -Pkbtv.build.abi=armeabi-v7a --console=plain

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: kbtvcaster-armeabi-v7a-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
