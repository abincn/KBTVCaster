name: Build v7a release APK

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create or update"
        required: true
        default: "v0.3.0-v7a"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Install Android platform 34 and NDK
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/cmdline-tools/16.0/bin:$PATH"
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" "ndk;28.2.13676358"

      - name: Decode signing key
        run: echo "${{ secrets.KBTV_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/kbtv.keystore"

      - name: Build armeabi-v7a release APK (DLNA-only, stub native lib)
        env:
          KBTV_KEYSTORE_PATH: ${{ runner.temp }}/kbtv.keystore
          KBTV_KEYSTORE_PASSWORD: ${{ secrets.KBTV_KEYSTORE_PASSWORD }}
          KBTV_KEY_ALIAS: ${{ secrets.KBTV_KEY_ALIAS }}
          KBTV_KEY_PASSWORD: ${{ secrets.KBTV_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease -Pkbtv.build.abi=armeabi-v7a --console=plain
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk out/kbtvcaster-0.3.0+5-armeabi-v7a.apk
          cd out && sha256sum *.apk > SHA256SUMS.txt

      - name: Verify APK signature
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME/build-tools/"*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify out/kbtvcaster-0.3.0+5-armeabi-v7a.apk

      - name: Publish fork Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          name: KBTVCaster fork v7a ${{ inputs.tag }}
          body: |
            Fork armeabi-v7a release (DLNA-only; AirPlay native library is a stub in 32-bit builds).
            versionCode 5, versionName 0.3.0. Signed with the fork release key, so it installs over earlier fork-signed builds; it cannot install over the debug test build (different signature, uninstall the debug build first).
          files: out/*
